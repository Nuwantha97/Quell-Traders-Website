kind = "web"
previewPath = "/"
title = "Quell Traders"
description = "A responsive company website for Quell Traders, a Kelaniya-based supplier of sustainable TIJ printing systems and industrial compressor spares."
version = "1.0.0"
id = "artifacts/quell-traders"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23134

[services.development]
run = "pnpm --filter @workspace/quell-traders run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/quell-traders", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "pnpm", "--filter", "@workspace/quell-traders", "run", "start" ]

[services.production.run.env]
PORT = "23134"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "23134"
BASE_PATH = "/"
